<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#8E2C57">
<title>2027 Life Planner</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --accent:#8E2C57;--accent-deep:#6E1F42;--accent-soft:#F8D7DF;--accent-faint:#FDF1F4;--on-accent:#fff;
  --bg:#FFF8F3;--card:#fff;--ink:#4A3540;--muted:#7A6670;--line:#D8C3CB;--line-soft:#EFE3E8;
  --success:#2F7D5B;--warn:#9A5A0E;--danger:#B3261E;
  --shadow:0 2px 12px rgba(74,53,64,.08);--r:16px;--r-sm:10px;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-mode=dark]{
  --ink:#F3E6EB;--muted:#C9B6BF;--line:#4D3A45;--line-soft:#3A2B34;--on-accent:#1E141A;
  --success:#6CCB9D;--warn:#E8A94E;--danger:#FF8A80;--shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html[data-mode=dark]{color-scheme:dark}
html[data-mode=light]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--accent-deep);margin:0;line-height:1.2;font-weight:700}
h2{font-size:1.5rem}h3{font-size:1.15rem}h4{font-size:1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-deep)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;z-index:500}
.skip:focus{left:8px}
.muted{color:var(--muted)}.sm{font-size:.88rem}.center{text-align:center}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--serif)}

/* ============ LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#content{width:100%;max-width:1200px;margin:0 auto;padding:16px 16px 110px}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
#top h1{font-size:1.35rem}
#top .sub{font-size:.82rem;color:var(--muted)}
#saved{font-size:.78rem;color:var(--muted);white-space:nowrap}
#saved.bad{color:var(--danger);font-weight:700}
#side{display:none}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);border-top:1px solid var(--line-soft);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
#bottom button{flex:1;min-height:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:12px}
#bottom button[aria-current=page]{color:var(--accent-deep);background:var(--accent-faint)}
.nb{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border:none;background:transparent;border-radius:12px;color:var(--muted);font-weight:600;text-align:left}
.nb:hover{background:var(--accent-faint)}
.nb[aria-current=page]{background:var(--accent);color:var(--on-accent)}
.brand{font-family:var(--serif);font-weight:700;color:var(--accent-deep);font-size:1.1rem;padding:6px 14px 16px;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.8rem;flex:none}
.sidefoot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:10px 14px}
@media(min-width:768px){
  #side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:78px;flex:none;padding:14px 10px;background:var(--card);border-right:1px solid var(--line-soft);overflow-y:auto}
  #bottom{display:none}
  #content{padding:24px 28px 48px}
  #top{padding:14px 28px}
  .nb{justify-content:center;padding:0}.nb .nl,.brand .bt,.sidefoot{display:none}.brand{justify-content:center;padding:6px 0 14px}
}
@media(min-width:1100px){
  #side{width:236px}
  .nb{justify-content:flex-start;padding:0 14px}.nb .nl,.brand .bt{display:inline}.sidefoot{display:block}.brand{justify-content:flex-start;padding:6px 14px 16px}
}

/* ============ COMPONENTS ============ */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ch h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.grid>*{min-width:0}
.cols2{display:grid;gap:16px;grid-template-columns:1fr}
.cols2>*{min-width:0}
@media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}.grid>.wide{grid-column:span 2}.cols2{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(12,1fr)}.grid>*{grid-column:span 4}.grid>.s6{grid-column:span 6}.grid>.s8{grid-column:span 8}.grid>.s12{grid-column:span 12}.grid>.s4{grid-column:span 4}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent-deep);font-weight:600;transition:background .15s,transform .1s;text-decoration:none}
.btn:hover{background:var(--accent-faint)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--accent-faint);color:var(--accent-deep)}
.ibtn.sm{width:36px;height:36px}
.ibtn[disabled]{opacity:.3;cursor:default}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit}
textarea.inp{min-height:92px;resize:vertical;line-height:1.5}
.inp::placeholder,.ghost::placeholder{color:var(--muted);opacity:1}
select.inp{appearance:auto}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.ghost{width:100%;min-width:0;min-height:40px;padding:8px 4px;border:none;border-bottom:1.5px solid transparent;background:transparent;color:inherit;font:inherit}
.ghost:hover{border-bottom-color:var(--line)}
.ghost:focus{outline:none;border-bottom-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-weight:600;font-size:.9rem}
.row{display:flex;align-items:center;gap:8px;min-height:44px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chk{display:grid;place-items:center;width:44px;height:44px;flex:none;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.done .ghost{text-decoration:line-through;color:var(--muted)}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--accent-faint);border:1px solid var(--line-soft)}
.seg button{border:none;background:transparent;min-height:36px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-deep);font-size:.76rem;font-weight:700;white-space:nowrap}
.tag.ok{background:rgba(47,125,91,.15);color:var(--success)}
.tag.warn{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.empty{padding:18px 8px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.nav3{display:flex;align-items:center;gap:6px}
.nav3 .ttl{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--accent-deep);min-width:0;text-align:center;padding:0 4px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--accent-faint),var(--card))}
.hero .greet{font-size:1.7rem;margin:4px 0 8px}
.quote{font-family:var(--serif);font-style:italic;color:var(--ink);max-width:46ch}
.ringbox{display:flex;align-items:center;gap:16px}
.ringtxt b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--accent-deep)}
.bannercard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-faint);border:1.5px dashed var(--accent)}
#banner{display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--warn);color:#fff;font-size:.9rem}
#banner.on{display:flex}
#banner button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;min-height:36px;padding:0 12px}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:.92rem}
.hchip .dot{width:12px;height:12px;border-radius:50%;background:var(--hc,var(--accent));flex:none}
.hchip[aria-pressed=true]{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent));color:#fff}
.hchip[aria-pressed=true] .dot{background:#fff}
.hchip .st{font-size:.78rem;opacity:1}
.water{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--accent)}
.drop[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:1.4rem;line-height:1;display:grid;place-items:center}
.mood[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.08)}
.slot{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line-soft)}
.slot .hr{width:52px;flex:none;font-size:.78rem;font-weight:700;color:var(--muted)}
.task{border-bottom:1px solid var(--line-soft)}
.task .acts{display:flex;flex:none}
@media(hover:hover){.task{position:relative}.task .acts{position:absolute;right:0;top:2px;background:var(--card);opacity:0;transition:opacity .15s;border-radius:10px}.task:hover .acts,.task:focus-within .acts{opacity:1}}
.chart.sm2{max-width:560px}
.addrow{display:flex;gap:8px;margin-top:8px}
.evrow{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;border:none;background:transparent;text-align:left;border-radius:10px;padding:2px 6px}
.evrow:hover{background:var(--accent-faint)}
.evdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ec,var(--accent))}

/* week */
.wtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.wtabs button{flex:1 0 auto;min-width:46px;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:.72rem;font-weight:700;color:var(--muted)}
.wtabs button b{font-size:1.05rem;color:var(--ink)}
.wtabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wtabs button[aria-pressed=true] b{color:var(--on-accent)}
.wtabs button.today{border-color:var(--accent);border-width:2.5px}
.wdays{display:grid;gap:14px;grid-template-columns:1fr}
.daycard.off{display:none}
.daycard.today{border:2px solid var(--accent)}
.daycard .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
@media(min-width:768px){.wtabs{display:none}.wdays{grid-template-columns:repeat(2,1fr)}.daycard.off{display:block}}
@media(min-width:1100px){.wdays{grid-template-columns:repeat(3,1fr)}}
.hgw{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--card)}
table.hg{border-collapse:separate;border-spacing:0;min-width:100%}
.hg th,.hg td{padding:0;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.hg th{padding:6px 0}
.hg .nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:132px;max-width:160px;padding:4px 10px;border-right:1px solid var(--line-soft);font-size:.9rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hg .pc{min-width:54px;padding:0 8px;font-size:.82rem;color:var(--ink)}
.hcell{position:relative;width:40px;height:40px;border:none;background:transparent;padding:0}
.hcell::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid var(--line)}
.hcell[aria-pressed=true]::before{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent))}
.hcell[aria-pressed=true]::after{content:"";position:absolute;left:15px;top:12px;width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.hcell.fut::before{border-style:dashed;opacity:.6}
.hcell.td::before{border-color:var(--accent);border-width:2.5px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.cell{min-height:58px;border:1px solid var(--line-soft);border-radius:10px;background:var(--card);padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;color:var(--ink)}
.cell:hover{border-color:var(--accent)}
.cell.out{opacity:.4}.cell.we{background:var(--accent-faint)}
.cell.today{border:2.5px solid var(--accent)}
.cell .n{font-weight:700;font-size:.85rem}
.cell .pill{display:none;font-size:.7rem;line-height:1.3;border-radius:6px;padding:1px 6px;color:#fff;background:var(--ec,var(--accent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .more{display:none;font-size:.7rem;color:var(--muted)}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--ec,var(--accent))}
@media(min-width:768px){.cell{min-height:100px;padding:6px}.cell .pill,.cell .more{display:block}.cell .dots{display:none}}

/* goals/notes */
.goalcard h3{font-size:1.1rem}
.mile{display:flex;align-items:center;gap:4px;min-height:40px}
.mile .chk{width:40px;height:40px}
.mile.done span{text-decoration:line-through;color:var(--muted)}
.notes{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.notes{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.notes{grid-template-columns:repeat(3,1fr)}}
.note{text-align:left;width:100%;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.note:hover{border-color:var(--accent)}
.note .body{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;font-size:.92rem}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line);background:var(--c)}
.sw[aria-pressed=true]{border-color:var(--card);box-shadow:0 0 0 3px var(--accent)}
.rate{display:grid;grid-template-columns:96px 1fr 28px;align-items:center;gap:10px}
.rate b{text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink);font-family:var(--sans)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scrollx{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:.95rem}
.kv:last-child{border-bottom:none}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:768px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--accent-faint);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-size:1.4rem;color:var(--accent-deep)}
.stat span{font-size:.78rem;color:var(--muted)}

/* overlay / modal / toast */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(30,20,26,.55);padding:16px}
.modal{width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:760px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 6px 20px}
.mb{padding:8px 20px 16px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:767px){
  .ov{align-items:flex-end;padding:0}
  .modal,.modal.wide{max-width:none;max-height:92vh;border-radius:22px 22px 0 0;animation:up .22s ease-out}
}
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
@media(min-width:768px){#toasts{bottom:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:min(92vw,460px);font-size:.92rem;animation:up .2s ease-out}
.toast button{border:none;background:rgba(255,255,255,.18);color:inherit;font-weight:700;border-radius:8px;min-height:36px;padding:0 12px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:300}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(600deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.confetti{display:none}}


/* ============ v2: connected life system ============ */
:root{--warn-solid:#8A4B00}
.topact{display:flex;align-items:center;gap:4px;flex:none}
.deskonly{display:none}
@media(min-width:768px){.deskonly{display:inline-flex}}
@media(max-width:479px){#saved:not(.bad){display:none}}

/* ---------- date helpers (local time, "YYYY-MM-DD" keys, no toISOString) ---------- */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3=DOW.map(d=>d.slice(0,3));
const pad=n=>String(n).padStart(2,'0');

const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);};
const diffDays=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);};
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const weekStartOf=(k,ws)=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()-ws+7)%7));return keyOf(d);};

const monthKey=k=>k.slice(0,7);
const fmtLong=k=>{const d=parseKey(k);return DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();};
const fmtShort=k=>{const d=parseKey(k);return MON3[d.getMonth()]+' '+d.getDate();};
const fmtMonthYear=k=>{const d=parseKey(k.length===7?k+'-01':k);return MONTHS[d.getMonth()]+' '+d.getFullYear();};
function fmtTime(t){if(!t)return'';const p=t.split(':').map(Number);return ((p[0]+11)%12+1)+(p[1]?':'+pad(p[1]):'')+' '+(p[0]<12?'AM':'PM');}

  ['goals','events','tasks','habits','notes','projects','lists'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  ['days','weeks','months','habitLog'].forEach(k=>{if(!out[k]||typeof out[k]!=='object'||Array.isArray(out[k]))out[k]={};});
  if(!Array.isArray(out.vision.values))out.vision.values=['','',''];

  ['cats','txns','bills','jars'].forEach(k=>{if(!Array.isArray(out.money[k]))out.money[k]=d.money[k];});
  if(!out.money.cats.length)out.money.cats=d.money.cats;
  const he=(o.health&&typeof o.health==='object'&&!Array.isArray(o.health))?o.health:{};

  ['weights','workouts'].forEach(k=>{if(!Array.isArray(out.health[k]))out.health[k]=[];});

function eventsOn(k){
  const d=parseKey(k),out=[];
  for(const e of S.events){
    if(!e.date) continue;
    if(e.date===k){out.push(e);continue;}
    if(k<e.date||!e.repeat||e.repeat==='none') continue;
    const o=parseKey(e.date);
    if(e.repeat==='weekly'){ if(diffDays(e.date,k)%7===0) out.push(e); }
    else if(e.repeat==='monthly'){ if(d.getDate()===o.getDate()) out.push(e); }
    else if(e.repeat==='yearly'){ if(d.getDate()===o.getDate()&&d.getMonth()===o.getMonth()) out.push(e); }
  }
  return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function billOccursOn(b,k){
  if(b.active===false||!b.date||k<b.date)return false;
  const d=parseKey(k),o=parseKey(b.date);
  if(b.repeat==='once')return b.date===k;
  if(b.repeat==='weekly')return d.getDay()===o.getDay();
  if(b.repeat==='yearly')return d.getMonth()===o.getMonth()&&d.getDate()===Math.min(o.getDate(),daysInMonth(d.getFullYear(),d.getMonth()+1));
  return d.getDate()===Math.min(o.getDate(),daysInMonth(d.getFullYear(),d.getMonth()+1)); /* monthly */
}

function habitStats(id){
  const set=new Set();
  for(const k in S.habitLog){ if(S.habitLog[k].indexOf(id)>=0) set.add(k); }
  const t=todayKey();
  let cur=0,k=set.has(t)?t:addDays(t,-1);
  while(set.has(k)){cur++;k=addDays(k,-1);}
  let best=0,run=0,prev=null;
  Array.from(set).sort().forEach(x=>{run=(prev&&addDays(prev,1)===x)?run+1:1;if(run>best)best=run;prev=x;});
  return{cur,best,total:set.size,set};
}
function habitRate(id,days){ /* share of the last N days (ending today) checked */
  const st=habitStats(id);let n=0,t=todayKey();for(let i=0;i<days;i++)if(st.set.has(addDays(t,-i)))n++;return n/days;
}

const modalStack=[];

function openModal(o){
  const prevFocus=document.activeElement;
  const overlay=h('div',{class:'ov'});
  const box=h('div',{class:'modal'+(o.wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':o.title});
  let closed=false;
  const api={el:box,body:null,close:null};
  function close(){
    if(closed)return;closed=true;
    overlay.remove();
    const i=modalStack.indexOf(api);if(i>=0)modalStack.splice(i,1);
    if(o.onClose)o.onClose();
    if(prevFocus&&prevFocus.focus&&document.contains(prevFocus)){try{prevFocus.focus({preventScroll:true});}catch(e){}}
  }
  api.close=close;api.dismissible=o.dismissible!==false;
  const body=h('div',{class:'mb'});
  api.body=body;
  if(o.body)body.append(o.body);
  const head=h('div',{class:'mh'},h('h3',{},o.title),api.dismissible?h('button',{type:'button',class:'ibtn sm','aria-label':'Close',onclick:close},icon('x')):null);
  box.append(head,body);
  if(o.actions&&o.actions.length){
    box.append(h('div',{class:'mf'},o.actions.map(a=>h('button',{type:'button',class:'btn '+(a.cls||''),onclick:()=>{ if(a.onClick){const r=a.onClick();if(r===false)return;} if(a.keepOpen!==true)close(); }},a.label))));
  }
  overlay.append(box);
  overlay.addEventListener('mousedown',e=>{if(e.target===overlay&&api.dismissible)close();});
  overlay.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      const f=$$('button,input,select,textarea,[href],[tabindex]:not([tabindex="-1"])',box).filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!f.length)return;
      const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  document.body.append(overlay);
  modalStack.push(api);
  const first=$('[data-autofocus],input:not([type=checkbox]):not([type=range]):not([type=hidden]),textarea,select',body)||$('.btn',box);
  if(first)setTimeout(()=>{try{first.focus({preventScroll:true});}catch(e){}},30);
  return api;
}

      h('div',{class:'row wrap noprint',style:'margin-top:10px;min-height:0'},
        dn?h('button',{type:'button',class:'btn sm',onclick:()=>{const old=l.items.slice();l.items=l.items.filter(i=>!i.done);saveSoon();render();toast('Cleared '+dn+' done item'+(dn>1?'s':''),{undo:()=>{l.items=old;saveSoon();render();}});}},'Clear done'):null,
        h('button',{type:'button',class:'btn sm danger',onclick:()=>removeItem(S.lists,l.id,'List')},'Delete list')));
    g.append(c);
  });
  wrap.append(g);return wrap;
};

/* =====================================================================
   QUICK ADD  (one place to capture anything)
   ===================================================================== */
function openQuickAdd(tab){
  const t0=todayKey();
  const tabs=[['task','Task','check'],['event','Event','calendar'],['note','Note','note']];
  if(modOn('money'))tabs.push(['expense','Money','wallet']);
  if(modOn('health'))tabs.push(['workout','Workout','heart']);
  let cur=tabs.some(x=>x[0]===tab)?tab:tabs[0][0];
  const st={task:{text:'',date:t0,priority:'',projectId:''},event:{title:'',date:t0,time:''},note:{title:'',body:''},expense:{type:'expense',amount:'',cat:catNames()[0]||'Other',note:'',date:t0},workout:{type:'Walk',mins:30,date:t0}};
  const bar=h('div',{class:'seg qa',role:'group','aria-label':'What to add',style:'max-width:100%;overflow-x:auto'});
  const dyn=h('div',{style:'margin-top:14px'});
  let first=null,pjc=null,wtc=null;
  function draw(){
    bar.replaceChildren(...tabs.map(x=>h('button',{type:'button','aria-pressed':cur===x[0]?'true':'false',onclick:()=>{cur=x[0];draw();}},x[1])));
    dyn.replaceChildren();const s=st[cur];
    if(cur==='task'){
      first=h('input',{class:'inp',value:s.text,maxlength:'200',placeholder:'What needs doing?','aria-label':'Task title','data-autofocus':'1',oninput:e=>{s.text=e.target.value;},onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();submit(false);}}});
      dyn.append(field('Task',first),h('div',{class:'cols2'},field('Date',h('input',{class:'inp',type:'date',value:s.date,'aria-label':'Date',onchange:e=>{s.date=e.target.value;}}),'Clear it to send to your Inbox.'),
        field('Priority',h('select',{class:'inp','aria-label':'Priority',onchange:e=>{s.priority=e.target.value;},value:s.priority},opts(PRIORITIES,s.priority)))),
        modOn('projects')?field('Project',(pjc=comboNew({label:'Project',items:[['','No project']].concat(S.projects.filter(p=>p.status!=='Done').map(p=>[p.id,p.title])),value:s.projectId,newText:'New project\u2026',placeholder:'Project name'})).node):null);
    }else if(cur==='event'){
      first=h('input',{class:'inp',value:s.title,maxlength:'120',placeholder:'Event title','aria-label':'Event title','data-autofocus':'1',oninput:e=>{s.title=e.target.value;},onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();submit(false);}}});
      dyn.append(field('Event',first),h('div',{class:'cols2'},field('Date',h('input',{class:'inp',type:'date',value:s.date,'aria-label':'Date',onchange:e=>{s.date=e.target.value;}})),field('Time (optional)',h('input',{class:'inp',type:'time',value:s.time,'aria-label':'Time',onchange:e=>{s.time=e.target.value;}}))));
    }else if(cur==='note'){
      first=h('input',{class:'inp',value:s.title,maxlength:'120',placeholder:'Title','aria-label':'Note title','data-autofocus':'1',oninput:e=>{s.title=e.target.value;}});
      dyn.append(field('Title',first),field('Note',h('textarea',{class:'inp',rows:'5','aria-label':'Note text',placeholder:'Write anything…',oninput:e=>{s.body=e.target.value;}},s.body)));
    }else if(cur==='expense'){
      const names=catNames();
      first=h('input',{class:'inp',type:'text',inputmode:'decimal',value:s.amount,placeholder:'0.00','aria-label':'Amount','data-autofocus':'1',oninput:e=>{s.amount=e.target.value;},onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();submit(false);}}});
      dyn.append(h('div',{class:'seg',role:'group','aria-label':'Type',style:'margin-bottom:12px'},[['expense','Expense'],['income','Income']].map(o=>h('button',{type:'button','aria-pressed':s.type===o[0]?'true':'false',onclick:()=>{s.type=o[0];draw();}},o[1]))),
        h('div',{class:'cols2'},field('Amount',first),field('Date',h('input',{class:'inp',type:'date',value:s.date,'aria-label':'Date',onchange:e=>{s.date=e.target.value;}}))),
        s.type==='expense'?field('Category',h('select',{class:'inp','aria-label':'Category',onchange:e=>{s.cat=e.target.value;},value:s.cat},names.map(n=>h('option',{value:n},n)))):null,
        field('Note',h('input',{class:'inp',value:s.note,maxlength:'120',placeholder:'Optional','aria-label':'Note',oninput:e=>{s.note=e.target.value;}})));
    }else{
      first=h('input',{class:'inp',type:'number',min:'1',max:'600',inputmode:'numeric',value:String(s.mins),'aria-label':'Minutes','data-autofocus':'1',oninput:e=>{s.mins=e.target.value;}});
      wtc=comboNew({label:'Workout type',items:allWorkoutTypes().map(n=>[n,n]),value:s.type,newText:'Add your own type\u2026',placeholder:'e.g. Badminton'});
      dyn.append(field('Type',wtc.node),
        h('div',{class:'cols2'},field('Minutes',first),field('Date',h('input',{class:'inp',type:'date',value:s.date,'aria-label':'Date',onchange:e=>{s.date=e.target.value;}}))));
    }
  }
  function submit(close){
    const s=st[cur];let msg='';
    if(cur==='task'){
      if(!s.text.trim()){first.focus();toast('Type the task first');return false;}
      S.tasks.push(newTask({date:s.date||'',text:s.text.trim(),priority:s.priority,projectId:pjc?resolveProject(pjc):''}));msg=s.date?'Task added for '+relDay(s.date):'Task added to your Inbox';s.text='';
    }else if(cur==='event'){
      if(!s.title.trim()){first.focus();toast('Give the event a title');return false;}
      if(!s.date){toast('Choose a date');return false;}
      S.events.push({id:uid(),title:s.title.trim(),date:s.date,time:s.time,color:EV_COLORS[0][0],note:'',important:false,repeat:'none'});msg='Event added for '+relDay(s.date);s.title='';
    }else if(cur==='note'){
      if(!s.title.trim()&&!s.body.trim()){first.focus();toast('Write something first');return false;}
      S.notes.push({id:uid(),title:s.title.trim(),body:s.body,tags:[],pinned:false,created:t0});msg='Note saved';s.title='';s.body='';
    }else if(cur==='expense'){
      const v=num(s.amount);if(!(v>0)){first.focus();toast('Enter an amount');return false;}
      S.money.txns.push({id:uid(),date:s.date||t0,type:s.type,amount:v,cat:s.type==='expense'?s.cat:'',note:s.note.trim(),jarId:'',billId:'',billDate:''});msg=(s.type==='income'?'Income':'Expense')+' of '+money(v)+' saved';s.amount='';s.note='';
    }else{
      const m=Math.round(num(s.mins));if(!(m>0)){first.focus();toast('Enter the minutes');return false;}
      S.health.workouts.push({id:uid(),date:s.date||t0,type:resolveText(wtc)||'Other',mins:m,note:''});syncAutoAll();msg='Workout saved';
    }
    saveSoon();render();toast(msg);
    if(!close){draw();if(first)setTimeout(()=>first.focus(),20);return false;}
  }
  draw();
  openModal({title:'Quick add',body:h('div',{},bar,dyn),actions:[{label:'Cancel'},{label:'Add & another',keepOpen:true,onClick:()=>submit(false)},{label:'Add',cls:'primary',onClick:()=>submit(true)}]});
}

/* =====================================================================
   GLOBAL SEARCH
   ===================================================================== */
function openSearch(){
  const input=h('input',{class:'inp',type:'search',placeholder:'Search tasks, notes, goals, projects, money…','aria-label':'Search everything','data-autofocus':'1'});
  const out=h('div',{style:'margin-top:12px'});
  let m;
  const go=(fn)=>()=>{m.close();fn();};
  function draw(){
    const q=input.value.trim().toLowerCase();out.replaceChildren();
    if(!q){out.append(h('p',{class:'muted sm'},'Type to search across your whole planner. Try a task, a note, a project, or "bills".'));return;}
    const has=(...a)=>a.join(' ').toLowerCase().indexOf(q)>=0;
    const sections=[];
    const jump=visibleMods().filter(x=>x[1].toLowerCase().indexOf(q)>=0).map(x=>({t:'Go to '+x[1],s:'',fn:()=>setView(x[0])}));
    if(jump.length)sections.push(['Jump to',jump]);
    sections.push(['Tasks',S.tasks.filter(x=>has(x.text,x.note||'')).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(b.date||'').localeCompare(a.date||'')).map(x=>({t:x.text,s:(x.done?'Done · ':'')+(x.date?relDay(x.date):'Inbox'),fn:()=>openTaskModal(x)}))]);
    sections.push(['Notes',S.notes.filter(x=>has(x.title,x.body,(x.tags||[]).join(' '))).map(x=>({t:x.title||'Untitled',s:(x.body||'').slice(0,60),fn:()=>openNoteModal(x)}))]);
    sections.push(['Goals',S.goals.filter(x=>has(x.title,x.why||'')).map(x=>({t:x.title,s:goalProgress(x)+'%',fn:openGoals}))]);
    if(modOn('projects'))sections.push(['Projects',S.projects.filter(x=>has(x.title,x.note||'')).map(x=>({t:x.title,s:x.status+' · '+projectProgress(x)+'%',fn:()=>openProject(x.id)}))]);
    sections.push(['Habits',activeHabits().filter(x=>has(x.name)).map(x=>({t:x.name,s:'🔥 '+habitStats(x.id).cur,fn:()=>setView('habits')}))]);
    sections.push(['Events',S.events.filter(x=>has(x.title,x.note||'')).map(x=>({t:x.title,s:fmtShort(x.date),fn:()=>openEventModal(x,x.date)}))]);
    if(modOn('lists'))sections.push(['Lists',S.lists.reduce((a,l)=>{if(has(l.title))a.push({t:l.title,s:l.items.length+' items',fn:()=>setView('lists')});l.items.filter(i=>has(i.text)).forEach(i=>a.push({t:i.text,s:'in '+l.title,fn:()=>setView('lists')}));return a;},[])]);
    if(modOn('money')){
      sections.push(['Money',S.money.txns.filter(x=>has(x.note||'',x.cat||'')).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>({t:(x.note||x.cat||x.type)+' · '+money(x.amount),s:fmtShort(x.date)+' · '+x.type,fn:()=>openTxnModal(x)}))]);
      sections.push(['Bills & jars',S.money.bills.filter(x=>has(x.name)).map(x=>({t:x.name+' · '+money(x.amount),s:'Bill',fn:()=>{ui.mTab='bills';setView('money');}})).concat(S.money.jars.filter(x=>has(x.name)).map(x=>({t:x.name,s:'Savings jar',fn:()=>{ui.mTab='savings';setView('money');}})))]);
    }
    let n=0;
    sections.forEach(sec=>{
      if(!sec[1].length)return;n+=sec[1].length;
      out.append(h('p',{class:'lbl',style:'margin:12px 0 4px'},sec[0]+' ('+sec[1].length+')'),...sec[1].slice(0,6).map(r=>h('button',{type:'button',class:'txn',onclick:go(r.fn)},h('span',{class:'tl'},h('strong',{},r.t),r.s?h('span',{class:'muted sm'},r.s):null))));
    });
    if(!n)out.append(h('p',{class:'muted'},'Nothing found for "'+input.value.trim()+'".'));
  }
  input.addEventListener('input',draw);
  m=openModal({title:'Search',body:h('div',{},input,out)});
  draw();
}

function startTour(force){
  if(tourEl)return;
  if(modalStack.length&&!force)return;
  while(modalStack.length)modalStack[modalStack.length-1].close();
  const steps=tourSteps();let i=0;
  const dim=h('div',{class:'tdim'}),spot=h('div',{class:'tspot'});
  const card=h('div',{class:'tcard',role:'dialog','aria-modal':'true','aria-label':'Tour'});
  const root=h('div',{class:'tour'},dim,spot,card);
  tourEl=root;document.body.append(root);
  function end(){document.removeEventListener('keydown',key,true);window.removeEventListener('resize',place);root.remove();tourEl=null;S.settings.tourDone=true;saveSoon();render();}
  function key(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();end();}else if(e.key==='ArrowRight'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}}
  document.addEventListener('keydown',key,true);window.addEventListener('resize',place);
  function go(d){const n=i+d;if(n<0)return;if(n>=steps.length){end();return;}i=n;show();}
  function target(s){let el=s.sel?s.sel():null;if(el&&el.getBoundingClientRect().width===0)el=null;return el;}
  function place(){
    const s=steps[i],el=target(s),vw=window.innerWidth,vh=window.innerHeight;
    const cw=Math.min(360,vw-24);card.style.width=cw+'px';
    if(el){
      const r=el.getBoundingClientRect(),p=6;
      spot.style.display='block';dim.style.display='none';
      spot.style.left=(r.left-p)+'px';spot.style.top=(r.top-p)+'px';spot.style.width=(r.width+p*2)+'px';spot.style.height=(r.height+p*2)+'px';
      const ch=card.getBoundingClientRect().height;
      let top=r.bottom+p+14;if(top+ch>vh-12)top=r.top-p-14-ch;if(top<12)top=Math.max(12,Math.min(vh-ch-12,(vh-ch)/2));
      let left=r.left+r.width/2-cw/2;left=Math.max(12,Math.min(vw-cw-12,left));
      card.style.top=top+'px';card.style.left=left+'px';
    }else{
      spot.style.display='none';dim.style.display='block';
      const ch=card.getBoundingClientRect().height;
      card.style.top=Math.max(12,(vh-ch)/2)+'px';card.style.left=((vw-cw)/2)+'px';
    }
  }
  function show(){
    const s=steps[i];
    if(s.view&&ui.view!==s.view)setView(s.view,true);
    card.replaceChildren(
      h('p',{class:'lbl'},'Step '+(i+1)+' of '+steps.length),
      h('h3',{style:'margin:4px 0 8px'},s.title),
      h('p',{},s.text),
      h('div',{class:'tdots','aria-hidden':'true'},steps.map((x,j)=>h('i',{class:j===i?'on':''}))),
      h('div',{class:'tbtns'},
        h('button',{type:'button',class:'tskip',onclick:end},'Skip tour'),
        h('span',{class:'grow'}),
        i>0?h('button',{type:'button',class:'btn sm',onclick:()=>go(-1)},'Back'):null,
        s.last?h('button',{type:'button',class:'btn sm',onclick:()=>{end();openGuide('start');}},'Open guide'):null,
        h('button',{type:'button',class:'btn primary sm','data-tournext':'1',onclick:()=>go(1)},s.last?'Finish':'Next')));
    place();
    setTimeout(()=>{const b=$('[data-tournext]',card);if(b)b.focus({preventScroll:true});},0);
  }
  show();
}

function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=h('a',{href:url,download:'life-planner-backup-'+todayKey()+'.json',style:'display:none'});
    document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    S.settings.lastBackupDate=todayKey();saveSoon();render();
    toast('Backup saved to your Downloads folder');
  }catch(e){toast('Could not create the backup file');}
}
function validateBackup(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return 'This file does not look like a Life Planner backup.';
  if(typeof o.schemaVersion!=='number')return 'This file has no version information, so it is probably not a Life Planner backup.';
  if(o.schemaVersion>SCHEMA)return 'This backup was made by a newer version of the planner and cannot be opened here.';
  for(const k of ['goals','events','tasks','habits','notes','projects','lists'])if(o[k]!==undefined&&!Array.isArray(o[k]))return 'The backup is damaged ('+k+' is not a list).';
  for(const k of ['days','weeks','months','habitLog','settings','vision','money','health','focus'])if(o[k]!==undefined&&(typeof o[k]!=='object'||o[k]===null||Array.isArray(o[k])))return 'The backup is damaged ('+k+' is not valid).';
  return null;
}
function mergeInto(cur,inc){
  const byId=(a,b)=>{const ids=new Set(a.map(x=>x.id));b.forEach(x=>{if(x&&x.id&&!ids.has(x.id))a.push(x);});};
  ['goals','events','tasks','habits','notes','projects','lists'].forEach(k=>byId(cur[k],inc[k]));
  ['txns','bills','jars'].forEach(k=>byId(cur.money[k],inc.money[k]));
  const names=new Set(cur.money.cats.map(c=>c.name));inc.money.cats.forEach(c=>{if(c&&!names.has(c.name)){cur.money.cats.push(c);names.add(c.name);}});
  ['workouts','weights'].forEach(k=>byId(cur.health[k],inc.health[k]));
  if(!cur.health.targetWeight&&inc.health.targetWeight)cur.health.targetWeight=inc.health.targetWeight;
  byId(cur.focus.sessions,inc.focus.sessions);
  ['days','weeks','months'].forEach(k=>{for(const key in inc[k])if(!(key in cur[k]))cur[k][key]=inc[k][key];});
  for(const key in inc.habitLog){const a=cur.habitLog[key]||(cur.habitLog[key]=[]);inc.habitLog[key].forEach(id=>{if(a.indexOf(id)<0)a.push(id);});}
}
function startImport(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('Could not read that file');
  fr.onload=()=>{
    let o;try{o=JSON.parse(String(fr.result));}catch(e){toast('That file is not valid JSON, so nothing was changed.');return;}
    const err=validateBackup(o);
    if(err){openModal({title:'Cannot import',body:h('p',{},err+' Your current data was not changed.'),actions:[{label:'OK',cls:'primary'}]});return;}
    const inc=migrate(o);
    const cnt=(a,n)=>a.length+' '+n;
    const sum=[cnt(inc.goals,'goals'),cnt(inc.habits,'habits'),cnt(inc.projects,'projects'),cnt(inc.events,'events'),cnt(inc.tasks,'tasks'),cnt(inc.notes,'notes'),cnt(inc.money.txns,'money entries'),cnt(inc.health.workouts,'workouts'),Object.keys(inc.days).length+' daily pages'].join(', ');
    openModal({title:'Import backup',body:h('div',{},h('p',{},'This backup contains: '+sum+'.'),h('p',{class:'muted sm',style:'margin-top:10px'},'Replace swaps everything in this planner for the backup. Merge keeps what you have now and adds anything new from the backup.')),
      actions:[{label:'Cancel'},
        {label:'Merge',onClick:()=>{mergeInto(S,inc);syncAutoAll();saveNow();render();toast('Backup merged');}},
        {label:'Replace everything',cls:'primary',onClick:()=>{S=inc;S.settings.onboarded=true;syncAutoAll();saveNow();render();toast('Backup restored');}}]});
  };
  fr.readAsText(file);
}

/* =====================================================================
   BOOT + KEYBOARD
   ===================================================================== */
function isTyping(el){return el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable);}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(closeTopModal())e.preventDefault();return;}
  if(e.ctrlKey||e.metaKey||e.altKey||modalStack.length||isTyping(document.activeElement))return;
  if(e.key==='t'||e.key==='T'){ui.date=todayKey();ui.hMonth=monthKey(ui.date);ui.rMonth=ui.hMonth;ui.mMonth=ui.hMonth;render();}
  else if(e.key==='/'){e.preventDefault();openSearch();}
  else if(e.key==='?'){e.preventDefault();openGuide(GUIDE_BY_VIEW[ui.view]);}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();openQuickAdd();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    const dir=e.key==='ArrowLeft'?-1:1;
    if(ui.view==='plan'){e.preventDefault();planStep(dir);}
    else if(ui.view==='habits'){ui.hMonth=monthKey(addMonths(ui.hMonth+'-01',dir));render();}
    else if(ui.view==='review'){ui.rMonth=monthKey(addMonths(ui.rMonth+'-01',dir));render();}
    else if(ui.view==='money'){ui.mMonth=monthKey(addMonths(ui.mMonth+'-01',dir));render();}
  }
});
let lastToday=todayKey();
function checkRollover(){const t=todayKey();if(t!==lastToday){if(ui.date===lastToday)ui.date=t;lastToday=t;syncAuto(t);render();}tickTimer();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();else checkRollover();});
window.addEventListener('pagehide',()=>{saveNow();});
window.addEventListener('focus',checkRollover);
function boot(){
  loadState();loadUI();applyTheme();
  $('#bannerx').addEventListener('click',()=>$('#banner').classList.remove('on'));
  if(!storageOK)showBanner('Saving is disabled in this browser mode. Your data will be lost when you close the tab. Use Settings > Export Backup.');
  if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');const f=()=>{if(S.settings.dark===null)render();};if(mq.addEventListener)mq.addEventListener('change',f);}
  syncAutoAll();
  render();
  tickTimer();setInterval(tickTimer,1000);
  if(!S.settings.onboarded)showOnboarding();
  else if(!S.settings.tourDone)setTimeout(()=>startTour(),700);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
